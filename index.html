
<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>نقشه میدانی سرشماری - حوزه ۰۰۵</title>

    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
    <link rel="stylesheet" href="css/qgis2web.css">
    <link rel="stylesheet" href="css/fontawesome-all.min.css">
    <link rel="stylesheet" href="css/leaflet.photon.css">

    <style>
        * { box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Tahoma, Arial, sans-serif;
            direction: rtl;
        }

        #map {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: #ddd;
        }

        .field-tools {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1200;
            width: 190px;
            max-width: calc(100vw - 24px);
            max-height: calc(100vh - 24px);
            overflow-y: auto;
            padding: 9px;
            background: rgba(255,255,255,.97);
            border: 1px solid #aaa;
            border-radius: 9px;
            box-shadow: 0 2px 10px rgba(0,0,0,.28);
            direction: rtl;
        }

        .field-title {
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            line-height: 1.8;
            padding-bottom: 7px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 7px;
        }

        .field-tools button {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 4px;
            border: 1px solid #aaa;
            border-radius: 6px;
            background: #fff;
            color: #222;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 12px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .field-tools button:active {
            background: #e5e5e5;
        }

        .field-tools button.gps-active {
            background: #e4f5e7;
            border-color: #219653;
            color: #126b35;
        }

        .field-tools button.active-tool {
            background: #e8f1ff;
            border-color: #2878c8;
        }

        .field-tools button:disabled {
            opacity: .55;
            cursor: wait;
        }

        .field-tools hr {
            border: 0;
            border-top: 1px solid #ddd;
            margin: 8px 0;
        }

        .field-status {
            border-top: 1px solid #ddd;
            margin-top: 8px;
            padding-top: 7px;
            font-size: 11px;
            line-height: 1.9;
            color: #333;
            overflow-wrap: anywhere;
        }

        .field-status strong { color: #111; }

        .leaflet-popup-content {
            direction: rtl;
            text-align: right;
            font-family: Tahoma, Arial, sans-serif;
            line-height: 1.8;
        }

        .leaflet-popup-content table {
            direction: rtl;
            border-collapse: collapse;
            width: 100%;
        }

        .leaflet-popup-content td {
            border-bottom: 1px solid #eee;
            padding: 4px 5px;
            vertical-align: top;
            overflow-wrap: anywhere;
        }

        .leaflet-tooltip {
            direction: rtl;
            font-family: Tahoma, Arial, sans-serif;
        }

        .southwest-start-icon {
            background: transparent;
            border: none;
        }

        .start-block-label {
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            direction: ltr;
        }

        .start-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            background: #00cc44;
            border: 2px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 5px #000;
            flex-shrink: 0;
        }

        .start-text {
            display: inline-block;
            background: #008b35;
            color: white;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
            padding: 3px 7px;
            border-radius: 4px;
            box-shadow: 0 1px 4px #555;
        }

        /* قطب‌نمای نمایشی */
        .map-compass {
            position: absolute;
            z-index: 1100;
            left: 12px;
            bottom: 28px;
            width: 58px;
            height: 58px;
            border-radius: 50%;
            background: rgba(255,255,255,.94);
            border: 1px solid #777;
            box-shadow: 0 1px 6px rgba(0,0,0,.3);
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .compass-north {
            position: absolute;
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            font-weight: bold;
            color: #d71920;
        }

        .compass-needle {
            width: 4px;
            height: 35px;
            position: relative;
            transform-origin: center center;
        }

        .compass-needle:before {
            content: "";
            position: absolute;
            top: 0;
            left: -5px;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-bottom: 19px solid #d71920;
        }

        .compass-needle:after {
            content: "";
            position: absolute;
            bottom: 0;
            left: -5px;
            border-left: 7px solid transparent;
            border-right: 7px solid transparent;
            border-top: 16px solid #555;
        }

        .compass-center {
            position: absolute;
            width: 7px;
            height: 7px;
            background: #222;
            border: 1px solid white;
            border-radius: 50%;
            z-index: 2;
        }

        .leaflet-control-attribution {
            font-size: 9px !important;
        }

        @media(max-width: 600px) {
            .field-tools {
                width: 158px;
                top: 7px;
                right: 7px;
                padding: 6px;
                max-height: calc(100vh - 14px);
            }

            .field-title { font-size: 11px; }

            .field-tools button {
                font-size: 10px;
                padding: 7px 3px;
                margin: 4px 0;
            }

            .field-status {
                font-size: 10px;
                line-height: 1.8;
            }

            .start-text { font-size: 11px; }

            .map-compass {
                left: 8px;
                bottom: 25px;
                transform: scale(.9);
                transform-origin: bottom left;
            }

            .leaflet-control-zoom {
                margin-top: 8px !important;
                margin-left: 8px !important;
            }
        }
    </style>
</head>

<body>

<div id="map"></div>

<div class="field-tools">
    <div class="field-title">
        ابزار میدانی سرشماری<br>
        حوزه ۰۰۵
    </div>

    <button onclick="firstBlock()">شروع از بلوک شماره ۱</button>
    <button onclick="nextBlock()">رفتن به بلوک بعدی</button>
    <button onclick="zoomActive()">بزرگ‌نمایی بلوک فعال</button>
    <button onclick="resetActive()">لغو بلوک فعال</button>

    <hr>

    <button id="gpsButton" onclick="toggleGPS()">شروع GPS زنده</button>
    <button id="followButton" onclick="toggleFollow()">دنبال‌کردن موقعیت: روشن</button>
    <button onclick="routeToBlock('car')">مسیریابی خودرو</button>
    <button onclick="routeToBlock('foot')">مسیریابی پیاده</button>
    <button onclick="clearRoute()">پاک کردن مسیر</button>
    <button id="compassButton" onclick="toggleCompass()">فعال‌سازی قطب‌نما</button>

    <div id="fieldStatus" class="field-status">
        آماده به کار - حوزه ۰۰۵
    </div>
</div>

<div id="mapCompass" class="map-compass">
    <div class="compass-north">N</div>
    <div id="compassNeedle" class="compass-needle"></div>
    <div class="compass-center"></div>
</div>

<script src="js/qgis2web_expressions.js"></script>
<script src="js/leaflet.js"></script>
<script src="js/L.Control.Layers.Tree.min.js"></script>
<script src="js/leaflet.rotatedMarker.js"></script>
<script src="js/leaflet.pattern.js"></script>
<script src="js/leaflet-hash.js"></script>
<script src="js/Autolinker.min.js"></script>
<script src="js/rbush.min.js"></script>
<script src="js/labelgun.min.js"></script>
<script src="js/labels.js"></script>
<script src="js/leaflet.photon.js"></script>

<!-- داده‌های اصلی حوزه ۰۰۵؛ نام و مسیر فایل‌ها تغییر نکند -->
<script src="data/Blk2109_hoz005_1.js"></script>
<script src="data/hozpoint_2.js"></script>

<script>
// =====================================================
// تنظیمات اصلی نقشه حوزه ۰۰۵
// =====================================================

var map = L.map('map', {
    zoomControl: false,
    maxZoom: 28,
    minZoom: 1
}).fitBounds([
    [30.060216062639654, 54.349219377845195],
    [30.077527248325826, 54.379357179461124]
]);

var hash = new L.Hash(map);

map.attributionControl.setPrefix(
    '<a href="https://github.com/qgis2web/qgis2web">qgis2web</a> | Leaflet | QGIS'
);

var autolinker = new Autolinker({
    truncate: {
        length: 50,
        location: 'smart'
    }
});

L.control.zoom({
    position: 'topleft'
}).addTo(map);

// =====================================================
// ابزارهای عمومی
// =====================================================

function escapeHTML(value) {
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function fieldStatus(message) {
    var element = document.getElementById('fieldStatus');
    if (element) element.innerHTML = message;
}

function formatBlockNumber(value) {
    if (
        value === null ||
        value === undefined ||
        String(value).trim() === ''
    ) {
        return 'نامشخص';
    }

    var str = String(value).trim().replace(/,/g, '');
    var number = Number(str);

    if (Number.isFinite(number)) {
        return String(Math.trunc(number));
    }

    return str.replace(/^0+(?=\d)/, '');
}

function numericBlockValue(value) {
    if (
        value === null ||
        value === undefined ||
        String(value).trim() === ''
    ) {
        return Number.MAX_SAFE_INTEGER;
    }

    var number = Number(
        String(value).trim().replace(/,/g, '')
    );

    return Number.isFinite(number)
        ? Math.trunc(number)
        : Number.MAX_SAFE_INTEGER;
}

// ساخت جدول اطلاعات ویژگی‌ها
function makeFeaturePopup(feature, isBlock) {
    var properties = feature.properties || {};
    var popupContent = '<table>';

    Object.keys(properties).forEach(function(key) {
        var value = properties[key];

        if (
            value === null ||
            value === undefined ||
            value === ''
        ) return;

        if (isBlock && key === 'BLK_NO1405') {
            value = formatBlockNumber(value);
        }

        popupContent +=
            '<tr>' +
            '<td style="font-weight:bold;">' +
            escapeHTML(key) +
            '</td>' +
            '<td>' +
            autolinker.link(escapeHTML(String(value))) +
            '</td>' +
            '</tr>';
    });

    popupContent += '</table>';
    return popupContent;
}

// =====================================================
// نقشه ماهواره‌ای گوگل
// =====================================================

map.createPane('pane_GoogleSatellite_0');
map.getPane('pane_GoogleSatellite_0').style.zIndex = 400;

var layer_GoogleSatellite_0 = L.tileLayer(
    'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
    {
        pane: 'pane_GoogleSatellite_0',
        opacity: 1,
        attribution: 'Google Satellite',
        minZoom: 1,
        maxZoom: 28,
        minNativeZoom: 0,
        maxNativeZoom: 19
    }
);

map.addLayer(layer_GoogleSatellite_0);

// =====================================================
// لایه بلوک‌های حوزه ۰۰۵
// =====================================================

function pop_Blk2109_hoz005_1(feature, layer) {
    layer.bindPopup(
        makeFeaturePopup(feature, true),
        {
            maxHeight: 420,
            maxWidth: 360
        }
    );
}

function style_Blk2109_hoz005_1_0() {
    return {
        pane: 'pane_Blk2109_hoz005_1',
        opacity: 1,
        color: 'rgba(35,35,35,1.0)',
        dashArray: '',
        lineCap: 'square',
        lineJoin: 'bevel',
        weight: 1,
        fillOpacity: 0,
        interactive: true
    };
}

map.createPane('pane_Blk2109_hoz005_1');
map.getPane('pane_Blk2109_hoz005_1').style.zIndex = 401;
map.getPane('pane_Blk2109_hoz005_1').style['mix-blend-mode'] = 'normal';

var layer_Blk2109_hoz005_1 = new L.geoJson(
    json_Blk2109_hoz005_1,
    {
        attribution: '',
        interactive: true,
        dataVar: 'json_Blk2109_hoz005_1',
        layerName: 'layer_Blk2109_hoz005_1',
        pane: 'pane_Blk2109_hoz005_1',
        onEachFeature: pop_Blk2109_hoz005_1,
        style: style_Blk2109_hoz005_1_0
    }
).addTo(map);

// =====================================================
// لایه نقاط حوزه ۰۰۵
// =====================================================

function pop_hozpoint_2(feature, layer) {
    layer.bindPopup(
        makeFeaturePopup(feature, false),
        { maxHeight: 420, maxWidth: 360 }
    );
}

function style_hozpoint_2_0() {
    return {
        pane: 'pane_hozpoint_2',
        radius: 4,
        opacity: 1,
        color: 'rgba(35,35,35,1.0)',
        dashArray: '',
        weight: 1,
        fill: true,
        fillOpacity: 1,
        fillColor: 'rgba(133,182,111,1.0)',
        interactive: true
    };
}

map.createPane('pane_hozpoint_2');
map.getPane('pane_hozpoint_2').style.zIndex = 402;
map.getPane('pane_hozpoint_2').style['mix-blend-mode'] = 'normal';

var layer_hozpoint_2 = new L.geoJson(
    json_hozpoint_2,
    {
        attribution: '',
        interactive: true,
        dataVar: 'json_hozpoint_2',
        layerName: 'layer_hozpoint_2',
        pane: 'pane_hozpoint_2',
        onEachFeature: pop_hozpoint_2,
        pointToLayer: function(feature, latlng) {
            return L.circleMarker(
                latlng,
                style_hozpoint_2_0(feature)
            );
        }
    }
).addTo(map);

// =====================================================
// برچسب شماره بلوک‌ها و نقاط
// =====================================================

var labelIndex = 0;

layer_Blk2109_hoz005_1.eachLayer(function(layer) {
    var value = layer.feature.properties
        ? layer.feature.properties['BLK_NO1405']
        : null;

    layer.bindTooltip(
        '<div style="color:#e31a1c;font-size:12pt;font-weight:bold;">' +
        escapeHTML(formatBlockNumber(value)) +
        '</div>',
        {
            permanent: true,
            direction: 'center',
            offset: [0, -16],
            className: 'css_Blk2109_hoz005_1'
        }
    );

    if (typeof labels !== 'undefined') labels.push(layer);
    if (typeof totalMarkers !== 'undefined') totalMarkers += 1;

    if (typeof addLabel === 'function') {
        layer.added = true;
        addLabel(layer, labelIndex);
    }

    labelIndex++;
});

layer_hozpoint_2.eachLayer(function(layer) {
    var name = layer.feature.properties
        ? layer.feature.properties['name']
        : null;

    if (name !== null && name !== undefined && name !== '') {
        layer.bindTooltip(
            '<div style="color:#000;font-size:15pt;font-weight:bold;">' +
            escapeHTML(String(name)) +
            '</div>',
            {
                permanent: true,
                direction: 'center',
                offset: [0, -16],
                className: 'css_hozpoint_2'
            }
        );
    }

    if (typeof labels !== 'undefined') labels.push(layer);
    if (typeof totalMarkers !== 'undefined') totalMarkers += 1;

    if (typeof addLabel === 'function') {
        layer.added = true;
        addLabel(layer, labelIndex);
    }

    labelIndex++;
});

function refreshLabels() {
    if (typeof resetLabels === 'function') {
        resetLabels([
            layer_Blk2109_hoz005_1,
            layer_hozpoint_2
        ]);
    }
}

refreshLabels();

map.on('zoomend', refreshLabels);
map.on('layeradd', refreshLabels);
map.on('layerremove', refreshLabels);

// =====================================================
// ساخت فهرست بلوک‌ها با ترتیب عددی
// ترتیب: ۱، ۲، ۳، ۴ و ...
// =====================================================

var fieldBlocks = [];
var activeIndex = -1;
var activeLayer = null;
var startMarker = null;

layer_Blk2109_hoz005_1.eachLayer(function(layer) {
    var properties = layer.feature.properties || {};
    var value = properties['BLK_NO1405'];

    fieldBlocks.push({
        layer: layer,
        number: numericBlockValue(value),
        label: formatBlockNumber(value)
    });
});

fieldBlocks.sort(function(a, b) {
    return a.number - b.number;
});

// =====================================================
// مدیریت نشانگر شروع و بلوک فعال
// =====================================================

function clearStartMarker() {
    if (startMarker) {
        map.removeLayer(startMarker);
        startMarker = null;
    }
}

function restoreActiveStyle() {
    if (activeLayer) {
        layer_Blk2109_hoz005_1.resetStyle(activeLayer);
    }

    clearStartMarker();
    activeLayer = null;
}

function activateBlock(index) {
    if (!fieldBlocks.length) {
        fieldStatus('هیچ بلوکی در لایه حوزه ۰۰۵ پیدا نشد');
        return;
    }

    if (index < 0 || index >= fieldBlocks.length) {
        fieldStatus('شماره بلوک معتبر نیست');
        return;
    }

    restoreActiveStyle();

    activeIndex = index;
    activeLayer = fieldBlocks[index].layer;

    activeLayer.setStyle({
        color: '#ff6600',
        weight: 4,
        opacity: 1,
        fillColor: '#ffff00',
        fillOpacity: 0.35
    });

    if (activeLayer.bringToFront) {
        activeLayer.bringToFront();
    }

    var bounds = activeLayer.getBounds();
    var southwest = bounds.getSouthWest();

    map.fitBounds(bounds, {
        padding: [35, 35],
        maxZoom: 20
    });

    startMarker = L.marker(southwest, {
        title: 'نقطه شروع جنوب‌غربی بلوک',
        zIndexOffset: 2500,
        icon: L.divIcon({
            className: 'southwest-start-icon',
            html:
                '<div class="start-block-label">' +
                    '<span class="start-dot"></span>' +
                    '<span class="start-text">شروع</span>' +
                '</div>',
            iconSize: [85, 26],
            iconAnchor: [9, 13]
        })
    }).addTo(map);

    startMarker.bindPopup(
        '<strong>شروع پیمایش بلوک شماره ' +
        escapeHTML(fieldBlocks[index].label) +
        '</strong><br>' +
        'این نقطه در گوشه جنوب‌غربی محدوده بلوک قرار دارد و الزاماً ورودی واقعی ساختمان نیست.'
    );

    fieldStatus(
        '<strong>حوزه:</strong> ۰۰۵<br>' +
        '<strong>بلوک فعال:</strong> ' + fieldBlocks[index].label +
        '<br><strong>ترتیب پیمایش:</strong> ' +
        (index + 1) + ' از ' + fieldBlocks.length +
        '<br><strong>نقطه شروع:</strong> جنوب‌غربی بلوک'
    );
}

function firstBlock() {
    if (!fieldBlocks.length) {
        fieldStatus('هیچ بلوکی در لایه پیدا نشد');
        return;
    }

    activateBlock(0);
}

function nextBlock() {
    if (!fieldBlocks.length) return;

    if (activeIndex < 0) {
        activateBlock(0);
        return;
    }

    if (activeIndex + 1 >= fieldBlocks.length) {
        fieldStatus(
            '<strong>پایان پیمایش</strong><br>' +
            'به آخرین بلوک حوزه ۰۰۵ رسیده‌اید.'
        );
        return;
    }

    activateBlock(activeIndex + 1);
}

function zoomActive() {
    if (!activeLayer) {
        fieldStatus('ابتدا یک بلوک را انتخاب کنید');
        return;
    }

    map.fitBounds(activeLayer.getBounds(), {
        padding: [35, 35],
        maxZoom: 20
    });
}

function resetActive() {
    restoreActiveStyle();
    activeIndex = -1;
    fieldStatus('بلوک فعال لغو شد');
}

// =====================================================
// GPS زنده و پیوسته
// =====================================================

var gpsWatchId = null;
var gpsPosition = null;
var gpsMarker = null;
var gpsAccuracyCircle = null;
var followLocation = true;

function toggleFollow() {
    followLocation = !followLocation;

    var button = document.getElementById('followButton');

    button.innerText = followLocation
        ? 'دنبال‌کردن موقعیت: روشن'
        : 'دنبال‌کردن موقعیت: خاموش';

    button.classList.toggle('active-tool', followLocation);

    fieldStatus(
        followLocation
            ? 'دنبال‌کردن خودکار موقعیت فعال شد'
            : 'دنبال‌کردن خودکار موقعیت غیرفعال شد؛ GPS همچنان موقعیت را ثبت می‌کند'
    );
}

function stopGPS() {
    if (gpsWatchId !== null && navigator.geolocation) {
        navigator.geolocation.clearWatch(gpsWatchId);
    }

    gpsWatchId = null;

    var button = document.getElementById('gpsButton');
    button.innerText = 'شروع GPS زنده';
    button.classList.remove('gps-active');
}

function toggleGPS() {
    var button = document.getElementById('gpsButton');

    if (gpsWatchId !== null) {
        stopGPS();
        fieldStatus('ردیابی GPS متوقف شد');
        return;
    }

    if (!window.isSecureContext) {
        fieldStatus('برای استفاده از GPS، نقشه باید از طریق HTTPS باز شود');
        return;
    }

    if (!navigator.geolocation) {
        fieldStatus('مرورگر از GPS پشتیبانی نمی‌کند');
        return;
    }

    button.innerText = 'توقف GPS زنده';
    button.classList.add('gps-active');

    fieldStatus('در حال دریافت موقعیت GPS...');

    var firstFix = true;

    gpsWatchId = navigator.geolocation.watchPosition(
        function(position) {
            var lat = position.coords.latitude;
            var lng = position.coords.longitude;
            var accuracy = Math.max(
                1,
                position.coords.accuracy || 0
            );

            gpsPosition = L.latLng(lat, lng);

            if (!gpsMarker) {
                gpsMarker = L.circleMarker(gpsPosition, {
                    radius: 8,
                    color: '#ffffff',
                    weight: 3,
                    fillColor: '#0066ff',
                    fillOpacity: 1,
                    pane: 'markerPane'
                }).addTo(map);

                gpsMarker.bindPopup('موقعیت فعلی شما');
            } else {
                gpsMarker.setLatLng(gpsPosition);
            }

            if (!gpsAccuracyCircle) {
                gpsAccuracyCircle = L.circle(gpsPosition, {
                    radius: accuracy,
                    color: '#3388ff',
                    weight: 2,
                    fillColor: '#3388ff',
                    fillOpacity: 0.12
                }).addTo(map);
            } else {
                gpsAccuracyCircle.setLatLng(gpsPosition);
                gpsAccuracyCircle.setRadius(accuracy);
            }

            if (firstFix) {
                map.setView(
                    gpsPosition,
                    Math.max(map.getZoom(), 17)
                );
                firstFix = false;
            } else if (followLocation) {
                map.panTo(gpsPosition, {
                    animate: true,
                    duration: 0.35
                });
            }

            fieldStatus(
                '<strong>GPS فعال است</strong><br>' +
                'دقت مکانی: ' + Math.round(accuracy) + ' متر<br>' +
                'عرض جغرافیایی: ' + lat.toFixed(6) +
                '<br>طول جغرافیایی: ' + lng.toFixed(6) +
                '<br>دنبال‌کردن نقشه: ' +
                (followLocation ? 'روشن' : 'خاموش')
            );
        },
        function(error) {
            var message =
                error.code === 1 ? 'دسترسی مکان رد شده است؛ مجوز GPS را بررسی کنید' :
                error.code === 2 ? 'موقعیت فعلاً در دسترس نیست؛ GPS دستگاه را بررسی کنید' :
                'زمان دریافت GPS تمام شد؛ دوباره تلاش کنید';

            stopGPS();
            fieldStatus(message);
        },
        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 30000
        }
    );
}

// =====================================================
// مسیریابی خودرو و پیاده تا بلوک فعال
// مقصد مسیریابی: گوشه جنوب‌غربی بلوک فعال
// =====================================================

var routeLayer = null;
var routeRequestInProgress = false;

function clearRoute() {
    if (routeLayer) {
        map.removeLayer(routeLayer);
        routeLayer = null;
    }

    fieldStatus('مسیر قبلی پاک شد');
}

async function routeToBlock(mode) {
    if (routeRequestInProgress) return;

    if (!gpsPosition) {
        fieldStatus('ابتدا GPS را فعال کنید تا موقعیت شما مشخص شود');
        return;
    }

    if (!activeLayer || activeIndex < 0) {
        fieldStatus('ابتدا بلوک مقصد را انتخاب کنید');
        return;
    }

    if (!window.isSecureContext) {
        fieldStatus('برای مسیریابی، نقشه باید از طریق HTTPS باز شود');
        return;
    }

    if (routeLayer) {
        map.removeLayer(routeLayer);
        routeLayer = null;
    }

    // مقصد مسیر همان نقطه شروع جنوب‌غربی بلوک است
    var destination = activeLayer.getBounds().getSouthWest();

    var service = mode === 'car'
        ? 'https://routing.openstreetmap.de/routed-car/route/v1/driving/'
        : 'https://routing.openstreetmap.de/routed-foot/route/v1/driving/';

    var url =
        service +
        gpsPosition.lng + ',' + gpsPosition.lat + ';' +
        destination.lng + ',' + destination.lat +
        '?overview=full&geometries=geojson';

    routeRequestInProgress = true;
    fieldStatus('در حال محاسبه مسیر تا بلوک ' +
        fieldBlocks[activeIndex].label + ' ...');

    try {
        var response = await fetch(url);

        if (!response.ok) {
            throw new Error('Route service error');
        }

        var data = await response.json();

        if (!data.routes || !data.routes.length) {
            throw new Error('No route');
        }

        var route = data.routes[0];

        routeLayer = L.geoJSON(route.geometry, {
            style: {
                color: mode === 'car' ? '#0066ff' : '#00a651',
                weight: 5,
                opacity: 0.9,
                lineCap: 'round',
                lineJoin: 'round'
            }
        }).addTo(map);

        map.fitBounds(routeLayer.getBounds(), {
            padding: [40, 40]
        });

        fieldStatus(
            '<strong>' +
            (mode === 'car' ? 'مسیریابی خودرو' : 'مسیریابی پیاده') +
            ' انجام شد</strong><br>' +
            'مقصد: بلوک ' + fieldBlocks[activeIndex].label +
            '<br>مسافت: ' +
            (route.distance / 1000).toFixed(2) +
            ' کیلومتر<br>' +
            'زمان تقریبی: ' +
            Math.round(route.duration / 60) + ' دقیقه'
        );
    } catch (error) {
        fieldStatus(
            'مسیریابی انجام نشد؛ اتصال اینترنت یا سرویس مسیریابی را بررسی کنید.'
        );
    } finally {
        routeRequestInProgress = false;
    }
}

// =====================================================
// قطب‌نما با نمایش جهت روی نقشه
// =====================================================

var compassEnabled = false;
var compassHandler = null;

function setCompassHeading(heading) {
    var needle = document.getElementById('compassNeedle');

    if (needle) {
        needle.style.transform = 'rotate(' + heading + 'deg)';
    }
}

function stopCompass() {
    if (compassHandler) {
        window.removeEventListener(
            'deviceorientation',
            compassHandler,
            true
        );
    }

    compassHandler = null;
    compassEnabled = false;

    document.getElementById('mapCompass').style.display = 'none';

    var button = document.getElementById('compassButton');
    button.innerText = 'فعال‌سازی قطب‌نما';
    button.classList.remove('active-tool');
}

function toggleCompass() {
    if (!window.DeviceOrientationEvent) {
        fieldStatus('این دستگاه حسگر جهت‌یابی ندارد');
        return;
    }

    if (compassEnabled) {
        stopCompass();
        fieldStatus('قطب‌نما غیرفعال شد');
        return;
    }

    function startCompass() {
        compassEnabled = true;

        document.getElementById('mapCompass').style.display = 'flex';

        var button = document.getElementById('compassButton');
        button.innerText = 'غیرفعال‌کردن قطب‌نما';
        button.classList.add('active-tool');

        compassHandler = function(event) {
            var heading = event.webkitCompassHeading;

            if (heading === undefined || heading === null) {
                if (event.alpha === null || event.alpha === undefined) {
                    return;
                }

                heading = 360 - event.alpha;
            }

            heading = (heading + 360) % 360;
            setCompassHeading(heading);

            fieldStatus(
                '<strong>قطب‌نما فعال است</strong><br>' +
                'جهت حرکت دستگاه: ' +
                Math.round(heading) + ' درجه'
            );
        };

        window.addEventListener(
            'deviceorientation',
            compassHandler,
            true
        );

        fieldStatus('قطب‌نما فعال شد؛ دستگاه را حرکت دهید تا جهت نمایش داده شود');
    }

    if (
        typeof DeviceOrientationEvent.requestPermission === 'function'
    ) {
        DeviceOrientationEvent.requestPermission()
            .then(function(permission) {
                if (permission === 'granted') {
                    startCompass();
                } else {
                    fieldStatus('دسترسی قطب‌نما تأیید نشد');
                }
            })
            .catch(function() {
                fieldStatus('امکان فعال‌سازی قطب‌نما وجود ندارد');
            });
    } else {
        startCompass();
    }
}

// =====================================================
// اصلاح اندازه نقشه در موبایل و تبلت
// =====================================================

function refreshMapSize() {
    setTimeout(function() {
        map.invalidateSize(true);
    }, 250);
}

window.addEventListener('resize', refreshMapSize);
window.addEventListener('orientationchange', function() {
    setTimeout(refreshMapSize, 500);
});

// =====================================================
// توقف ابزارها هنگام بسته شدن صفحه
// =====================================================

window.addEventListener('pagehide', function() {
    stopGPS();

    if (compassHandler) {
        window.removeEventListener(
            'deviceorientation',
            compassHandler,
            true
        );
    }
});

// =====================================================
// آماده‌سازی اولیه
// =====================================================

document.getElementById('followButton').classList.add('active-tool');

fieldStatus(
    'نقشه حوزه ۰۰۵ آماده است<br>' +
    'تعداد بلوک‌ها: ' + fieldBlocks.length +
    '<br>برای شروع، دکمه «شروع از بلوک شماره ۱» را بزنید.'
);

setTimeout(function() {
    map.invalidateSize(true);
    refreshLabels();
}, 500);

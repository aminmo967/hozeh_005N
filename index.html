
<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <title>نقشه میدانی سرشماری - حوزه ۰۰۵</title>

    <link rel="stylesheet" href="css/leaflet.css">
    <link rel="stylesheet" href="css/L.Control.Layers.Tree.css">
    <link rel="stylesheet" href="css/qgis2web.css">
    <link rel="stylesheet" href="css/fontawesome-all.min.css">
    <link rel="stylesheet" href="css/leaflet.photon.css">

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: Tahoma, Arial, sans-serif;
            direction: rtl;
        }

        #map {
            width: 100%;
            height: 100%;
            min-height: 400px;
        }

        .field-tools {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 1000;
            width: 185px;
            max-width: calc(100vw - 24px);
            padding: 9px;
            background: rgba(255,255,255,.97);
            border: 1px solid #aaa;
            border-radius: 9px;
            box-shadow: 0 2px 9px rgba(0,0,0,.25);
            direction: rtl;
        }

        .field-title {
            font-weight: bold;
            font-size: 13px;
            text-align: center;
            padding-bottom: 8px;
            border-bottom: 1px solid #ddd;
            margin-bottom: 7px;
        }

        .field-tools button {
            display: block;
            width: 100%;
            margin: 5px 0;
            padding: 8px 4px;
            border: 1px solid #aaa;
            border-radius: 6px;
            background: #fff;
            color: #222;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 12px;
            cursor: pointer;
        }

        .field-tools button:active {
            background: #e3e3e3;
        }

        .field-tools button.gps-active {
            background: #e4f5e7;
            border-color: #219653;
        }

        .field-status {
            border-top: 1px solid #ddd;
            margin-top: 7px;
            padding-top: 7px;
            font-size: 11px;
            line-height: 1.9;
            color: #333;
            overflow-wrap: anywhere;
        }

        .leaflet-popup-content {
            direction: rtl;
            text-align: right;
            font-family: Tahoma, Arial, sans-serif;
        }

        .leaflet-tooltip {
            direction: rtl;
            font-family: Tahoma, Arial, sans-serif;
        }

        .southwest-start-icon {
            background: transparent;
            border: none;
        }

        .start-block-label {
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            direction: ltr;
        }

        .start-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            box-sizing: content-box;
            background: #00cc44;
            border: 2px solid white;
            border-radius: 50%;
            box-shadow: 0 0 5px #000;
            flex-shrink: 0;
        }

        .start-text {
            display: inline-block;
            background: #008b35;
            color: white;
            font-family: Tahoma, Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
            padding: 3px 7px;
            border-radius: 4px;
            box-shadow: 0 1px 4px #555;
        }

        @media(max-width: 600px) {
            .field-tools {
                width: 155px;
                top: 7px;
                right: 7px;
                padding: 6px;
            }

            .field-title {
                font-size: 11px;
            }

            .field-tools button {
                font-size: 10px;
                padding: 7px 3px;
                margin: 4px 0;
            }

            .field-status {
                font-size: 10px;
            }

            .start-text {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

<div id="map"></div>

<div class="field-tools">
    <div class="field-title">ابزار میدانی سرشماری<br>حوزه ۰۰۵</div>

    <button onclick="firstBlock()">شروع از بلوک شماره ۱</button>
    <button onclick="nextBlock()">رفتن به بلوک بعدی</button>
    <button onclick="zoomActive()">بزرگ‌نمایی بلوک فعال</button>
    <button onclick="resetActive()">لغو بلوک فعال</button>

    <hr>

    <button id="gpsButton" onclick="toggleGPS()">شروع GPS زنده</button>
    <button onclick="routeToBlock('car')">مسیریابی خودرو</button>
    <button onclick="routeToBlock('foot')">مسیریابی پیاده</button>
    <button onclick="clearRoute()">پاک کردن مسیر</button>
    <button onclick="toggleCompass()">فعال‌سازی قطب‌نما</button>

    <div id="fieldStatus" class="field-status">
        آماده به کار - حوزه ۰۰۵
    </div>
</div>

<script src="js/qgis2web_expressions.js"></script>
<script src="js/leaflet.js"></script>
<script src="js/L.Control.Layers.Tree.min.js"></script>
<script src="js/leaflet.rotatedMarker.js"></script>
<script src="js/leaflet.pattern.js"></script>
<script src="js/leaflet-hash.js"></script>
<script src="js/Autolinker.min.js"></script>
<script src="js/rbush.min.js"></script>
<script src="js/labelgun.min.js"></script>
<script src="js/labels.js"></script>
<script src="js/leaflet.photon.js"></script>

<!-- فایل‌های اصلی حوزه ۰۰۵ -->
<script src="data/Blk2109_hoz005_1.js"></script>
<script src="data/hozpoint_2.js"></script>

<script>

// ========================================
// تنظیمات اصلی نقشه حوزه 005
// ========================================

var map = L.map('map', {
    zoomControl: false,
    maxZoom: 28,
    minZoom: 1
}).fitBounds([
    [30.060216062639654, 54.349219377845195],
    [30.077527248325826, 54.379357179461124]
]);

var hash = new L.Hash(map);

map.attributionControl.setPrefix(
    '<a href="https://github.com/qgis2web/qgis2web">qgis2web</a> | Leaflet | QGIS'
);

var autolinker = new Autolinker({
    truncate: {
        length: 30,
        location: 'smart'
    }
});

var bounds_group = new L.featureGroup([]);

L.control.zoom({
    position: 'topleft'
}).addTo(map);

// ========================================
// نقشه ماهواره‌ای گوگل
// ========================================

map.createPane('pane_GoogleSatellite_0');
map.getPane('pane_GoogleSatellite_0').style.zIndex = 400;

var layer_GoogleSatellite_0 = L.tileLayer(
    'https://mt1.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
    {
        pane: 'pane_GoogleSatellite_0',
        opacity: 1,
        attribution: 'Google Satellite',
        minZoom: 1,
        maxZoom: 28,
        minNativeZoom: 0,
        maxNativeZoom: 19
    }
);

map.addLayer(layer_GoogleSatellite_0);

// ========================================
// اصلاح نمایش شماره بلوک
// ========================================

function formatBlockNumber(value) {
    if (
        value === null ||
        value === undefined ||
        String(value).trim() === ''
    ) {
        return 'نامشخص';
    }

    var str = String(value).trim().replace(/,/g, '');
    var number = Number(str);

    if (Number.isFinite(number)) {
        return String(Math.trunc(number));
    }

    return str.replace(/^0+(?=\d)/, '');
}

function numericBlockValue(value) {
    if (
        value === null ||
        value === undefined ||
        String(value).trim() === ''
    ) {
        return Number.MAX_SAFE_INTEGER;
    }

    var number = Number(
        String(value).trim().replace(/,/g, '')
    );

    return Number.isFinite(number)
        ? Math.trunc(number)
        : Number.MAX_SAFE_INTEGER;
}

// ========================================
// پنجره اطلاعات عوارض
// ========================================

function removeEmptyRowsFromPopupContent(content, feature) {
    var tempDiv = document.createElement('div');
    tempDiv.innerHTML = content;

    var rows = tempDiv.querySelectorAll('tr');

    for (var i = 0; i < rows.length; i++) {
        var td = rows[i].querySelector('td[data-field]');

        if (td) {
            var key = td.getAttribute('data-field');
            var value = feature.properties[key];

            if (
                value === null ||
                value === undefined ||
                value === ''
            ) {
                rows[i].remove();
            }
        }
    }

    return tempDiv.innerHTML;
}

function addClassToPopupIfMedia(content, popup) {
    var tempDiv = document.createElement('div');
    tempDiv.innerHTML = content;

    var imgTd = tempDiv.querySelector('td img');

    if (!imgTd || !popup._contentNode) return;

    var src = imgTd.getAttribute('src') || '';

    if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
        popup._contentNode.classList.add('media');

        var img = popup._contentNode.querySelector('td img');

        if (img) {
            img.addEventListener('load', function() {
                popup.update();
            });
        }
    }
}

// ========================================
// لایه بلوک‌های حوزه 005
// ========================================

function pop_Blk2109_hoz005_1(feature, layer) {
    var popupContent = '<table>';
    var properties = feature.properties || {};

    Object.keys(properties).forEach(function(key) {
        var value = properties[key];

        if (
            value !== null &&
            value !== undefined &&
            value !== ''
        ) {
            // شماره بلوک در پنجره اطلاعات هم بدون اعشار
            if (key === 'BLK_NO1405') {
                value = formatBlockNumber(value);
            }

            popupContent +=
                '<tr>' +
                '<td style="font-weight:bold;padding:4px">' +
                autolinker.link(String(key)) +
                '</td>' +
                '<td style="padding:4px">' +
                autolinker.link(String(value)) +
                '</td>' +
                '</tr>';
        }
    });

    popupContent += '</table>';

    var content = removeEmptyRowsFromPopupContent(
        popupContent,
        feature
    );

    layer.on('popupopen', function(e) {
        addClassToPopupIfMedia(content, e.popup);
    });

    layer.bindPopup(content, {
        maxHeight: 400,
        maxWidth: 350
    });
}

function style_Blk2109_hoz005_1_0() {
    return {
        pane: 'pane_Blk2109_hoz005_1',
        opacity: 1,
        color: 'rgba(35,35,35,1.0)',
        dashArray: '',
        lineCap: 'square',
        lineJoin: 'bevel',
        weight: 1,
        fillOpacity: 0,
        interactive: true
    };
}

map.createPane('pane_Blk2109_hoz005_1');
map.getPane('pane_Blk2109_hoz005_1').style.zIndex = 401;
map.getPane('pane_Blk2109_hoz005_1').style['mix-blend-mode'] = 'normal';

var layer_Blk2109_hoz005_1 = new L.geoJson(
    json_Blk2109_hoz005_1,
    {
        attribution: '',
        interactive: true,
        dataVar: 'json_Blk2109_hoz005_1',
        layerName: 'layer_Blk2109_hoz005_1',
        pane: 'pane_Blk2109_hoz005_1',
        onEachFeature: pop_Blk2109_hoz005_1,
        style: style_Blk2109_hoz005_1_0
    }
);

bounds_group.addLayer(layer_Blk2109_hoz005_1);
map.addLayer(layer_Blk2109_hoz005_1);

// ========================================
// لایه نقاط حوزه 005
// ========================================

function pop_hozpoint_2(feature, layer) {
    var popupContent = '<table>';
    var properties = feature.properties || {};

    Object.keys(properties).forEach(function(key) {
        var value = properties[key];

        if (
            value !== null &&
            value !== undefined &&
            value !== ''
        ) {
            popupContent +=
                '<tr>' +
                '<td style="font-weight:bold;padding:4px">' +
                autolinker.link(String(key)) +
                '</td>' +
                '<td style="padding:4px">' +
                autolinker.link(String(value)) +
                '</td>' +
                '</tr>';
        }
    });

    popupContent += '</table>';

    layer.bindPopup(popupContent, {
        maxHeight: 400
    });
}

function style_hozpoint_2_0() {
    return {
        pane: 'pane_hozpoint_2',
        radius: 4,
        opacity: 1,
        color: 'rgba(35,35,35,1.0)',
        dashArray: '',
        weight: 1,
        fill: true,
        fillOpacity: 1,
        fillColor: 'rgba(133,182,111,1.0)',
        interactive: true
    };
}

map.createPane('pane_hozpoint_2');
map.getPane('pane_hozpoint_2').style.zIndex = 402;
map.getPane('pane_hozpoint_2').style['mix-blend-mode'] = 'normal';

var layer_hozpoint_2 = new L.geoJson(
    json_hozpoint_2,
    {
        attribution: '',
        interactive: true,
        dataVar: 'json_hozpoint_2',
        layerName: 'layer_hozpoint_2',
        pane: 'pane_hozpoint_2',
        onEachFeature: pop_hozpoint_2,

        pointToLayer: function(feature, latlng) {
            return L.circleMarker(
                latlng,
                style_hozpoint_2_0(feature)
            );
        }
    }
);

bounds_group.addLayer(layer_hozpoint_2);
map.addLayer(layer_hozpoint_2);

// ========================================
// برچسب بلوک‌ها و نقاط
// ========================================

var i = 0;

layer_Blk2109_hoz005_1.eachLayer(function(layer) {
    var blockValue =
        layer.feature.properties['BLK_NO1405'];

    layer.bindTooltip(
        '<div style="color:#e31a1c;font-size:12pt;font-weight:bold">' +
        formatBlockNumber(blockValue) +
        '</div>',
        {
            permanent: true,
            offset: [0, -16],
            className: 'css_Blk2109_hoz005_1'
        }
    );

    if (typeof labels !== 'undefined') {
        labels.push(layer);
    }

    if (typeof totalMarkers !== 'undefined') {
        totalMarkers += 1;
    }

    if (typeof addLabel === 'function') {
        layer.added = true;
        addLabel(layer, i);
    }

    i++;
});

var j = 0;

layer_hozpoint_2.eachLayer(function(layer) {
    var name = layer.feature.properties['name'];

    if (name !== null && name !== undefined) {
        layer.bindTooltip(
            '<div style="color:#000;font-size:15pt;font-weight:bold">' +
            String(name) +
            '</div>',
            {
                permanent: true,
                offset: [0, -16],
                className: 'css_hozpoint_2'
            }
        );
    }

    if (typeof labels !== 'undefined') {
        labels.push(layer);
    }

    if (typeof totalMarkers !== 'undefined') {
        totalMarkers += 1;
    }

    if (typeof addLabel === 'function') {
        layer.added = true;
        addLabel(layer, j);
    }

    j++;
});

if (typeof resetLabels === 'function') {
    resetLabels([
        layer_Blk2109_hoz005_1,
        layer_hozpoint_2
    ]);

    map.on('zoomend', function() {
        resetLabels([
            layer_Blk2109_hoz005_1,
            layer_hozpoint_2
        ]);
    });

    map.on('layeradd', function() {
        resetLabels([
            layer_Blk2109_hoz005_1,
            layer_hozpoint_2
        ]);
    });

    map.on('layerremove', function() {
        resetLabels([
            layer_Blk2109_hoz005_1,
            layer_hozpoint_2
        ]);
    });
}

// ========================================
// ابزار انتخاب و پیمایش بلوک‌ها
// ========================================

var fieldBlocks = [];
var activeIndex = -1;
var activeLayer = null;
var startMarker = null;

// ساخت فهرست بلوک‌ها
layer_Blk2109_hoz005_1.eachLayer(function(layer) {
    var properties = layer.feature.properties || {};
    var value = properties['BLK_NO1405'];

    fieldBlocks.push({
        layer: layer,
        number: numericBlockValue(value),
        label: formatBlockNumber(value)
    });
});

// مرتب‌سازی فقط بر اساس شماره بلوک: 1، 2، 3 و ...
fieldBlocks.sort(function(a, b) {
    return a.number - b.number;
});

// ========================================
// وضعیت پنل
// ========================================

function fieldStatus(message) {
    var element = document.getElementById('fieldStatus');

    if (element) {
        element.innerHTML = message;
    }
}

// ========================================
// نشانگر شروع در گوشه جنوب‌غربی بلوک
// ========================================

function clearStartMarker() {
    if (startMarker) {
        map.removeLayer(startMarker);
        startMarker = null;
    }
}

function restoreActiveStyle() {
    if (activeLayer) {
        layer_Blk2109_hoz005_1.resetStyle(activeLayer);
    }

    clearStartMarker();
    activeLayer = null;
}

function activateBlock(index) {
    if (!fieldBlocks.length) {
        fieldStatus('بلوک قابل استفاده پیدا نشد');
        return;
    }

    if (index < 0 || index >= fieldBlocks.length) {
        fieldStatus('شماره بلوک معتبر نیست');
        return;
    }

    restoreActiveStyle();

    activeIndex = index;
    activeLayer = fieldBlocks[index].layer;

    // تغییر رنگ بلوک انتخاب‌شده
    activeLayer.setStyle({
        color: '#ff6600',
        weight: 4,
        opacity: 1,
        fillColor: '#ffff00',
        fillOpacity: 0.35
    });

    if (activeLayer.bringToFront) {
        activeLayer.bringToFront();
    }

    var bounds = activeLayer.getBounds();

    map.fitBounds(bounds, {
        padding: [35, 35],
        maxZoom: 20
    });

    // مختصات دقیق گوشه جنوب‌غربی محدوده بلوک
    var southwest = bounds.getSouthWest();

    // نشانگر سبز همراه با برچسب شروع
    startMarker = L.marker(southwest, {
        title: 'شروع پیمایش بلوک',
        zIndexOffset: 2000,
        icon: L.divIcon({
            className: 'southwest-start-icon',
            html:
                '<div class="start-block-label">' +
                    '<span class="start-dot"></span>' +
                    '<span class="start-text">شروع</span>' +
                '</div>',
            iconSize: [85, 26],
            iconAnchor: [9, 13]
        })
    }).addTo(map);

    startMarker.bindPopup(
        'نقطه شروع بلوک شماره ' +
        fieldBlocks[index].label +
        '<br>این نقطه در گوشه جنوب‌غربی محدوده بلوک قرار دارد و الزاماً ورودی واقعی نیست.'
    );

    fieldStatus(
        'حوزه: ۰۰۵<br>' +
        'بلوک فعال: ' + fieldBlocks[index].label +
        '<br>ترتیب پیمایش: ' + (index + 1) +
        ' از ' + fieldBlocks.length +
        '<br>محل شروع: گوشه جنوب‌غربی'
    );
}

function firstBlock() {
    if (!fieldBlocks.length) {
        fieldStatus('هیچ بلوکی در لایه پیدا نشد');
        return;
    }

    activateBlock(0);
}

function nextBlock() {
    if (!fieldBlocks.length) return;

    if (activeIndex < 0) {
        activateBlock(0);
        return;
    }

    if (activeIndex + 1 >= fieldBlocks.length) {
        fieldStatus('به آخرین بلوک حوزه رسیده‌اید');
        return;
    }

    activateBlock(activeIndex + 1);
}

function zoomActive() {
    if (!activeLayer) {
        fieldStatus('ابتدا یک بلوک انتخاب کنید');
        return;
    }

    map.fitBounds(activeLayer.getBounds(), {
        padding: [35, 35],
        maxZoom: 20
    });
}

function resetActive() {
    restoreActiveStyle();
    activeIndex = -1;
    fieldStatus('بلوک فعال لغو شد');
}

// ========================================
// GPS زنده و پیوسته
// ========================================

var gpsWatchId = null;
var gpsPosition = null;
var gpsMarker = null;
var gpsAccuracyCircle = null;

function toggleGPS() {
    var button = document.getElementById('gpsButton');

    if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;

        button.innerText = 'شروع GPS زنده';
        button.classList.remove('gps-active');

        fieldStatus('ردیابی GPS متوقف شد');
        return;
    }

    if (!window.isSecureContext) {
        fieldStatus('برای استفاده از GPS باید نقشه از طریق HTTPS باز شود');
        return;
    }

    if (!navigator.geolocation) {
        fieldStatus('مرورگر از GPS پشتیبانی نمی‌کند');
        return;
    }

    button.innerText = 'توقف GPS زنده';
    button.classList.add('gps-active');

    fieldStatus('در حال دریافت موقعیت GPS...');

    var firstFix = true;

    gpsWatchId = navigator.geolocation.watchPosition(
        function(position) {
            var lat = position.coords.latitude;
            var lng = position.coords.longitude;
            var accuracy = Math.max(
                1,
                position.coords.accuracy || 0
            );

            gpsPosition = L.latLng(lat, lng);

            if (!gpsMarker) {
                gpsMarker = L.circleMarker(gpsPosition, {
                    radius: 8,
                    color: '#ffffff',
                    weight: 3,
                    fillColor: '#0066ff',
                    fillOpacity: 1
                }).addTo(map);

                gpsMarker.bindPopup('موقعیت فعلی شما');
            } else {
                gpsMarker.setLatLng(gpsPosition);
            }

            if (!gpsAccuracyCircle) {
                gpsAccuracyCircle = L.circle(gpsPosition, {
                    radius: accuracy,
                    color: '#3388ff',
                    fillColor: '#3388ff',
                    fillOpacity: 0.12
                }).addTo(map);
            } else {
                gpsAccuracyCircle.setLatLng(gpsPosition);
                gpsAccuracyCircle.setRadius(accuracy);
            }

            if (firstFix) {
                map.setView(
                    gpsPosition,
                    Math.max(map.getZoom(), 17)
                );
                firstFix = false;
            } else {
                map.panTo(gpsPosition, {
                    animate: true,
                    duration: 0.4
                });
            }

            fieldStatus(
                'GPS فعال است<br>' +
                'دقت مکانی: ' + Math.round(accuracy) + ' متر<br>' +
                'عرض جغرافیایی: ' + lat.toFixed(6) +
                '<br>طول جغرافیایی: ' + lng.toFixed(6)
            );
        },
        function(error) {
            var message =
                error.code === 1 ? 'دسترسی مکان رد شده است' :
                error.code === 2 ? 'موقعیت فعلاً در دسترس نیست' :
                'زمان دریافت GPS تمام شد';

            if (gpsWatchId !== null) {
                navigator.geolocation.clearWatch(gpsWatchId);
            }

            gpsWatchId = null;

            button.innerText = 'شروع GPS زنده';
            button.classList.remove('gps-active');

            fieldStatus(message);
        },
        {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 30000
        }
    );
}

// ========================================
// مسیریابی خودرو و پیاده
// ========================================

var routeLayer = null;

function clearRoute() {
    if (routeLayer) {
        map.removeLayer(routeLayer);
        routeLayer = null;
    }

    fieldStatus('مسیر پاک شد');
}

async function routeToBlock(mode) {
    if (!gpsPosition) {
        fieldStatus('ابتدا GPS را فعال کنید');
        return;
    }

    if (!activeLayer) {
        fieldStatus('ابتدا بلوک مقصد را انتخاب کنید');
        return;
    }

    if (routeLayer) {
        map.removeLayer(routeLayer);
        routeLayer = null;
    }

    var destination = activeLayer.getBounds().getCenter();

    var service = mode === 'car'
        ? 'https://routing.openstreetmap.de/routed-car/route/v1/driving/'
        : 'https://routing.openstreetmap.de/routed-foot/route/v1/driving/';

    var url =
        service +
        gpsPosition.lng + ',' + gpsPosition.lat + ';' +
        destination.lng + ',' + destination.lat +
        '?overview=full&geometries=geojson';

    fieldStatus('در حال محاسبه مسیر...');

    try {
        var response = await fetch(url);

        if (!response.ok) {
            throw new Error('خطا در دریافت مسیر');
        }

        var data = await response.json();

        if (!data.routes || !data.routes.length) {
            throw new Error('مسیر پیدا نشد');
        }

        var route = data.routes[0];

        routeLayer = L.geoJSON(route.geometry, {
            style: {
                color: mode === 'car' ? '#0066ff' : '#00a651',
                weight: 5,
                opacity: 0.85
            }
        }).addTo(map);

        map.fitBounds(routeLayer.getBounds(), {
            padding: [35, 35]
        });

        fieldStatus(
            (mode === 'car' ? 'مسیریابی خودرو' : 'مسیریابی پیاده') +
            ' انجام شد<br>' +
            'مسافت: ' + (route.distance / 1000).toFixed(2) +
            ' کیلومتر<br>' +
            'زمان تقریبی: ' +
            Math.round(route.duration / 60) + ' دقیقه'
        );
    } catch (error) {
        fieldStatus(
            'خطا در مسیریابی؛ اتصال اینترنت یا سرویس مسیر را بررسی کنید'
        );
    }
}

// ========================================
// قطب‌نما
// ========================================

var compassEnabled = false;
var compassHandler = null;

function toggleCompass() {
    if (!window.DeviceOrientationEvent) {
        fieldStatus('این دستگاه از قطب‌نما پشتیبانی نمی‌کند');
        return;
    }

    if (compassEnabled) {
        if (compassHandler) {
            window.removeEventListener(
                'deviceorientation',
                compassHandler,
                true
            );
        }

        compassEnabled = false;
        fieldStatus('قطب‌نما غیرفعال شد');
        return;
    }

    function startCompass() {
        compassEnabled = true;

        compassHandler = function(event) {
            var heading = event.webkitCompassHeading;

            if (heading === undefined || heading === null) {
                heading = event.alpha;

                if (heading === null || heading === undefined) {
                    return;
                }

                heading = 360 - heading;
            }

            fieldStatus(
                'قطب‌نما فعال است<br>' +
                'جهت: ' + Math.round(heading) + ' درجه'
            );
        };

        window.addEventListener(
            'deviceorientation',
            compassHandler,
            true
        );

        fieldStatus('قطب‌نما فعال شد');
    }

    if (
        typeof DeviceOrientationEvent.requestPermission === 'function'
    ) {
        DeviceOrientationEvent.requestPermission()
            .then(function(permission) {
                if (permission === 'granted') {
                    startCompass();
                } else {
                    fieldStatus('دسترسی قطب‌نما تأیید نشد');
                }
            })
            .catch(function() {
                fieldStatus('امکان فعال‌سازی قطب‌نما وجود ندارد');
            });
    } else {
        startCompass();
    }
}
